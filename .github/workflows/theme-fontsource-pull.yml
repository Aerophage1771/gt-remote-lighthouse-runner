name: Theme fontsource pull

on:
  push:
    branches: [main]
    paths:
      - 'theme-fontsource/**'
      - '.github/workflows/theme-fontsource-pull.yml'
  pull_request:
    branches: [main]
    paths:
      - 'theme-fontsource/**'
      - '.github/workflows/theme-fontsource-pull.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Collect available Fontsource packages
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures
          import json
          import shutil
          import subprocess
          import tarfile
          import tempfile
          from pathlib import Path

          slugs = [x.strip() for x in Path('theme-fontsource/slugs.txt').read_text().splitlines() if x.strip()]
          out_root = Path('fontsource-out')
          out_root.mkdir(exist_ok=True)

          def score(path, weight):
              n = path.name.lower()
              v = 0
              if 'latin-ext' in n: v -= 20
              elif 'latin' in n: v += 30
              if 'italic' in n: v -= 100
              if 'normal' in n: v += 30
              if 'wght' in n or 'variable' in n: v += 50
              if str(weight) in n: v += 70
              if weight == 400 and 'regular' in n: v += 40
              if weight == 700 and 'bold' in n: v += 40
              return v - len(n) / 1000

          def extract_selected(package_dir, dest):
              files = [p for p in package_dir.rglob('*.woff2') if p.is_file()]
              if not files:
                  return []
              dest.mkdir(parents=True, exist_ok=True)
              reg = max(files, key=lambda p: score(p, 400))
              bold = max(files, key=lambda p: score(p, 700))
              shutil.copy2(reg, dest / 'regular.woff2')
              shutil.copy2(bold, dest / 'bold.woff2')
              copied = [reg.name, bold.name]
              var = [p for p in files if ('wght' in p.name.lower() or 'variable' in p.name.lower()) and 'italic' not in p.name.lower()]
              if var:
                  vp = max(var, key=lambda p: score(p, 400))
                  shutil.copy2(vp, dest / 'variable.woff2')
                  copied.append(vp.name)
              for meta in ('package.json', 'LICENSE', 'OFL.txt'):
                  found = list(package_dir.rglob(meta))
                  if found:
                      shutil.copy2(found[0], dest / meta)
              return copied

          def collect(slug):
              result = {'slug': slug, 'static': False, 'variable': False, 'files': [], 'errors': []}
              with tempfile.TemporaryDirectory(prefix='fsp-') as td_s:
                  td = Path(td_s)
                  for kind, package in (('static', f'@fontsource/{slug}@latest'), ('variable', f'@fontsource-variable/{slug}@latest')):
                      pd = td / kind
                      pd.mkdir()
                      try:
                          p = subprocess.run(['npm','pack',package,'--silent','--pack-destination',str(pd)], stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True, timeout=70)
                      except Exception as exc:
                          result['errors'].append(f'{kind}: {exc!r}')
                          continue
                      if p.returncode != 0:
                          result['errors'].append(f'{kind}: {p.stderr.strip()[-220:]}')
                          continue
                      tgz = next(pd.glob('*.tgz'), None)
                      if not tgz:
                          result['errors'].append(f'{kind}: no archive')
                          continue
                      ex = pd / 'extract'
                      ex.mkdir()
                      with tarfile.open(tgz, 'r:gz') as tf:
                          tf.extractall(ex)
                      copied = extract_selected(ex / 'package', out_root / slug / kind)
                      if copied:
                          result[kind] = True
                          result['files'].extend([f'{kind}/{x}' for x in copied])
              print(f"{slug}: static={result['static']} variable={result['variable']}")
              return result

          results=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as pool:
              futs={pool.submit(collect,s):s for s in slugs}
              for fut in concurrent.futures.as_completed(futs):
                  s=futs[fut]
                  try: results.append(fut.result())
                  except Exception as exc: results.append({'slug':s,'static':False,'variable':False,'files':[],'errors':[repr(exc)]})
          results.sort(key=lambda x:x['slug'])
          Path('fontsource-report.json').write_text(json.dumps(results,indent=2))
          print('FOUND',sum(1 for r in results if r['static'] or r['variable']),'OF',len(results))
          PY
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: theme-fontsource-bundle
          path: |
            fontsource-out
            fontsource-report.json
          if-no-files-found: error
          compression-level: 9
          retention-days: 2
