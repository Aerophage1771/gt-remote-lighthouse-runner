name: Theme artifact smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'theme-fontsource/smoke-*'
      - '.github/workflows/theme-artifact-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create smoke artifact
        run: |
          mkdir -p smoke-output
          printf 'artifact pipeline works\n' > smoke-output/status.txt
      - uses: actions/upload-artifact@v4
        with:
          name: theme-artifact-smoke
          path: smoke-output
